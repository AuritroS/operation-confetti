<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1320" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Operation Confetti</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>

    <!-- Gameplay input surface. Sits above the canvas, below UI controls. -->
    <div id="surface" aria-hidden="true"></div>

    <!--
      Minimal by design: the score, and the pause control the design doc
      requires. Stage, gift count and route progress moved to the debug
      panel — on a phone, in one hand, a clean frame reads better than a
      complete one, and none of those numbers change a decision mid-run.
    -->
    <div id="hud" class="hud">
      <div class="hud__stats">
        <div class="hud__score-row">
          <span class="hud__score" id="hud-score">0</span>
          <span class="hud__delta" id="hud-delta" hidden></span>
        </div>
        <!-- Discrete stage indicator, as the design doc allows. No timer. -->
        <span class="hud__stage" id="hud-stage">1/3</span>
      </div>
    </div>
    <!-- Level 3 mounts its health and cannon readouts here. -->
    <div id="level-hud"></div>

    <!-- Brief edge pulse on a hit. Readable at any screen size, no draw calls. -->
    <div id="vignette" class="vignette" hidden></div>

    <div id="debug" class="debug"></div>


    <!--
      Pause is never asked for: it happens when the player leaves, and the
      only way out is this overlay. A pause button on a one-thumb game is a
      target to hit by accident during play.
    -->
    <div id="pause" class="overlay" hidden>
      <div class="overlay__card frame">
        <!-- Which chapter they are in; the shell fills it when it pauses. -->
        <p class="eyebrow" id="pause-chapter"></p>
        <strong>Paused</strong>
        <button id="btn-resume" type="button" class="btn btn--primary">Resume</button>
      </div>
    </div>

    <!-- Non-blocking line for a result. Story panels replace this in phase C. -->
    <div id="banner" class="banner" hidden></div>

    <div id="rotate" class="rotate" hidden>
      <div class="rotate__card frame">
        <p class="eyebrow">Portrait only</p>
        <p>Please turn your phone upright.</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/entry.ts"></script>
</body>
</html>
