<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1320" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Operation Confetti</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>

    <!-- Gameplay input surface. Sits above the canvas, below UI controls. -->
    <div id="surface" aria-hidden="true"></div>

    <!--
      Minimal by design: the score, and the pause control the design doc
      requires. Stage, gift count and route progress moved to the debug
      panel — on a phone, in one hand, a clean frame reads better than a
      complete one, and none of those numbers change a decision mid-run.
    -->
    <div id="hud" class="hud">
      <span class="hud__score" id="hud-score">0</span>
      <span class="hud__delta" id="hud-delta" hidden></span>
      <button class="hud__btn" id="btn-pause" type="button" aria-label="Pause">II</button>
    </div>

    <!-- Brief edge pulse on a hit. Readable at any screen size, no draw calls. -->
    <div id="vignette" class="vignette" hidden></div>

    <div id="debug" class="debug"></div>

    <!-- Desktop-only control legend; hidden on touch devices by main.ts. -->
    <div id="hint" class="hint" hidden>
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> / <kbd>A</kbd><kbd>D</kbd> lane</span>
      <span><kbd>Space</kbd> tap &middot; hold</span>
      <span><kbd>P</kbd> pause</span>
      <span><kbd>R</kbd> restart</span>
    </div>

    <div id="pause" class="pause-pill" hidden>
      Paused
      <small id="pause-note">Tap to resume</small>
    </div>

    <div id="rotate" class="rotate" hidden>
      <div class="rotate__card">
        <p>Please turn your phone upright.</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/entry.ts"></script>
</body>
</html>
