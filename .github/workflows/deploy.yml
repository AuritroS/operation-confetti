# Deploy to the Worker, from main only, after the checks have passed, and
# only once a person approves in the production environment.
#
# The build is redone here on a fresh runner rather than reused from the
# checks run: the thing that ships is proven from a clean checkout, and the
# cost is two minutes. The Worker's own secrets (Supabase) live in
# Cloudflare's store and are never seen here; CI holds only the account id
# and an API token scoped to editing Workers.
name: deploy

on:
  workflow_run:
    workflows: [checks]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://operation-confetti.auritro.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run assets:build
      - run: npm run build

      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
