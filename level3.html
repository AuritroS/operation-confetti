<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10172c" />
  <title>Level 3 · Aurora's birthday gala</title>
  <link rel="stylesheet" href="/src/level3.css" />
</head>
<body>
  <main id="practice">
    <canvas id="practice-stage" aria-hidden="true"></canvas>
    <div id="practice-surface" aria-label="Game area: swipe left or right to change lanes, tap to fire"></div>
    <header class="practice-hud">
      <div><span class="eyebrow">LEVEL 3 / BOSS FIGHT</span><strong>Aurora’s birthday gala</strong></div>
      <span class="score" id="hud-score">0</span>
    </header>
    <span class="hud__delta" id="hud-delta" hidden></span>
    <!-- The boss readouts mount here; the component builds its own markup. -->
    <div id="level-hud"></div>
    <div id="vignette" class="vignette" hidden></div>
    <div class="boss-beat" id="boss-beat" aria-live="polite">Practice · no damage</div>
    <div id="practice-scene-status" class="practice-scene-status" role="status">Loading birthday rooftop…</div>
    <div id="practice-debug" class="practice-debug" hidden>Lane <strong id="practice-lane">2 / 3</strong> · <span id="practice-perf"></span></div>
    <div id="practice-cues" class="practice-cues" hidden>1 strike · 2 orb · 3 shield · 4 block · 5 gift · 6 take · 7 win · 8 lose · 9 clear</div>
    <div id="practice-paused" class="practice-overlay" hidden>
      <strong>Paused</strong>
      <button id="practice-resume" type="button">Resume</button>
    </div>
    <div id="boss-result" class="practice-overlay" hidden>
      <strong id="boss-result-title"></strong><span id="boss-result-detail"></span>
      <button id="boss-restart" type="button">Practice again</button>
    </div>
    <footer class="practice-help">
      <button id="boss-start" type="button">Begin fight</button>
      <span id="practice-counts">Practice: <strong id="practice-shots">0</strong> shots · <strong id="practice-hits">0</strong> hits</span>
    </footer>
  </main>
  <script type="module" src="/src/level3.ts"></script>
</body>
</html>
